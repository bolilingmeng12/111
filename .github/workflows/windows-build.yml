name: build-windows
on:
  push:
    branches: [ feature/arena-legend-infer ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (root)
        run: npm install

      - name: Install renderer deps & build (Vite)
        working-directory: ./src/renderer
        run: |
          npm install
          npm run build

      - name: Compile TypeScript (electron)
        run: npx tsc -p tsconfig.json

      - name: Package with electron-builder
        run: npx electron-builder --windows nsis --x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hs-legend-infer-windows
          path: |
            dist/*.exe
            dist/**/*.exe
            dist/**/*
